services:
  tiktok-clipper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiktok-clipper-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_WHISPER_MODEL=${GROQ_WHISPER_MODEL:-whisper-large-v3}
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-openai/gpt-oss-120b}
      - DEFAULT_MIN_DURATION=15
      - DEFAULT_MAX_DURATION=60
      - DEFAULT_NUM_CLIPS=3
      - DEFAULT_NICHE=umum
    volumes:
      # Persistensi direktori output klip video yang dihasilkan
      - ./output:/app/output
      # Persistensi cache unduhan & transkrip
      - ./cache:/app/cache
      # Persistensi catatan log pemrosesan
      - ./logs:/app/logs
      # Opsional: Berkas cookies YouTube jika diperlukan
      - ./cookies.txt:/app/cookies.txt:ro
